# Replace the example IP if deploying elsewhere. 80 is only for ACME challenges.
server {
    listen 80;
    server_name 82.157.65.130;
    location /.well-known/acme-challenge/ { root /var/lib/toz-acme; }
    location / { return 301 https://82.157.65.130$request_uri; }
}
server {
    listen 443 ssl;
    server_name 82.157.65.130;
    ssl_certificate /etc/letsencrypt/live/82.157.65.130/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.157.65.130/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location ~ ^/(auth|account|sync|health)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }
    location = /toz { return 308 /toz/; }
    location = /toz/sql-wasm.wasm {
        alias /opt/toz-web/current/sql-wasm.wasm;
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /toz/ {
        alias /opt/toz-web/current/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }
}
