# Replace the example IP if deploying elsewhere. 80 is only for ACME challenges.
server {
    listen 80;
    server_name 82.157.65.130;
    location /.well-known/acme-challenge/ { root /var/lib/toz-acme; }
    location / { return 301 https://82.157.65.130$request_uri; }
}
server {
    listen 443 ssl;
    server_name 82.157.65.130;
    ssl_certificate /etc/letsencrypt/live/82.157.65.130/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.157.65.130/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 35s;
    }
}
